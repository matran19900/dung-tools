# =============================================================================
# Redis-log RIÊNG cho system-report — TÁCH KHỎI HẠ TẦNG PRODUCTION (§3.4-5).
#
#   Đây KHÔNG phải Redis cache/queue của {{PROJECT}}. Nó chỉ chứa namespace REPORT_*.
#   Lý do tách: telemetry hỏng/đầy bộ nhớ KHÔNG được kéo theo hệ thống thật.
#
#   Chạy:   redis-server /path/to/transport-redis.conf
#   Docker: docker run -d --name report-redis --restart unless-stopped \
#             -p 127.0.0.1:6399:6399 \
#             -v /srv/report-redis/transport-redis.conf:/etc/redis.conf:ro \
#             -v /srv/report-redis/data:/data \
#             redis:7 redis-server /etc/redis.conf
# =============================================================================

port 6399
bind 0.0.0.0
protected-mode yes

# ── Auth (BẮT BUỘC nếu instance nằm ngoài localhost) ─────────────────────────
# Đặt password ở ĐÂY, và chỉ ở đây (file chmod 600, KHÔNG commit).
# Runner + Reporter đọc cùng giá trị này qua env REPORT_REDIS_PASS.
requirepass {{REDIS_PASSWORD}}

# ACL siết chặt hơn: user chỉ chạm được key REPORT_* — dùng khi nhiều dự án
# dùng chung 1 Redis-log. Bỏ comment và thay password.
# user default off
# user reporter on >{{REDIS_PASSWORD}} ~REPORT_* &* +@write +@read +@keyspace -@dangerous
# user triage   on >{{TRIAGE_PASSWORD}} ~REPORT_* &* +@read +scan +smembers -@write -@dangerous

# ── Trần bộ nhớ: telemetry KHÔNG được ăn hết RAM máy ─────────────────────────
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Bền vững vừa đủ: mất vài phút log không sao, mất cả ngày thì mất báo cáo ──
appendonly no
save 300 1
dir /data
dbfilename report-dump.rdb

# ── Chống lệnh nguy hiểm (triage/reporter không cần) ──────────────────────────
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG ""
rename-command SHUTDOWN ""

# ── Log ───────────────────────────────────────────────────────────────────────
loglevel notice
timeout 300
tcp-keepalive 60

# ── Kiểm tra sau khi dựng ─────────────────────────────────────────────────────
#   redis-cli -h 127.0.0.1 -p 6399 -a "$REPORT_REDIS_PASS" --no-auth-warning PING
#   redis-cli ... --scan --pattern 'REPORT_*'
#   redis-cli ... SMEMBERS REPORT_INSTANCES
# Chỉ được thấy key REPORT_* ở đây. Thấy key của dự án → đang trỏ nhầm Redis production.
